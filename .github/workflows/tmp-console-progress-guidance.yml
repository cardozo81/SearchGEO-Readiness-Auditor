name: tmp-console-progress-guidance

on:
  push:
    branches:
      - feat/console-progress-m20-m23-guidance

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused console tests
        run: python -m unittest tests.test_console_progress_guidance tests.test_interactive_console tests.test_m23_integration -v
      - name: Full regression
        run: python -m unittest discover -s tests -v
