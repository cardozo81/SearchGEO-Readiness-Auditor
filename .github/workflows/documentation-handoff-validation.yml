name: Documentation handoff validation

on:
  push:
    branches:
      - documentation-stable-baseline-handoff
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package
        run: python -m pip install -e .

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Validate documentation structure and local links
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          required = [
              Path('README.md'),
              Path('docs/COMPATIBILITY.md'),
              Path('docs/INSTALLATION.md'),
              Path('docs/USER_GUIDE.md'),
              Path('docs/CONFIGURATION.md'),
              Path('docs/REPORT_GUIDE.md'),
              Path('docs/RULES_GUIDE.md'),
              Path('docs/SCORING_GUIDE.md'),
              Path('docs/AI_GUIDE.md'),
              Path('docs/OUTPUTS_AND_ARTIFACTS.md'),
              Path('docs/TECHNICAL_GUIDE.md'),
              Path('docs/TROUBLESHOOTING.md'),
              Path('docs/SMOKE_TEST.md'),
          ]
          errors = []
          for path in required:
              if not path.is_file():
                  errors.append(f'missing required document: {path}')

          link_re = re.compile(r'(?<!!)\[[^\]]+\]\(([^)]+)\)')
          for path in required:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for target in link_re.findall(text):
                  target = target.strip().split('#', 1)[0]
                  if not target or '://' in target or target.startswith(('mailto:', '#')):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      errors.append(f'broken local link: {path} -> {target}')

          combined = '\n'.join(
              path.read_text(encoding='utf-8') for path in required if path.is_file()
          )
          forbidden = [
              r'\bsk-[A-Za-z0-9_-]{16,}\b',
              r'OPENAI_API_KEY\s*=\s*["\'][^<][^"\']{10,}["\']',
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
          ]
          for pattern in forbidden:
              if re.search(pattern, combined):
                  errors.append(f'possible secret pattern found: {pattern}')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f'documentation validation OK: {len(required)} required files')

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Full unit and critical suite
        run: python -m unittest discover -s tests -v
