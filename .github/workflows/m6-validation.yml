name: M6 temporary validation

on:
  push:
    branches:
      - m6-javascript-spa

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: M6 incremental tests
        run: python -m unittest discover -s tests -p 'test_m6_javascript_spa.py' -v
