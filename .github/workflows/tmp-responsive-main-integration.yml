name: tmp-responsive-main-integration

on:
  push:
    branches:
      - feat/report-responsive-panels-main-integration

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Install Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install chromium
      - name: Compile and full regression
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Responsive contract
        shell: python
        run: |
          from searchgeo.report_navigation import NAV_ITEMS, _PREMIUM_CSS
          names = [name for _, name in NAV_ITEMS]
          assert names.index('accessibility.html') < names.index('web-performance.html')
          assert 'searchgeo-premium-report-v2' in _PREMIUM_CSS
          assert 'minmax(320px,390px)' in _PREMIUM_CSS
          assert '@media(max-width:700px)' in _PREMIUM_CSS
          assert '.snapshot>figure{grid-column:1;grid-row:1' in _PREMIUM_CSS
          print('RESPONSIVE_CONTRACT=PASS')
