name: SCORE-GEO-002 integration validation

on:
  push:
    branches:
      - score-geo-002-main-integration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Directed scoring and M18 regression
        run: python -m unittest tests.test_m9_scoring tests.test_score_geo_002_applicability tests.test_m18_multi_ai_provider tests.test_m18_operational_contract
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -p 'test_*.py'
