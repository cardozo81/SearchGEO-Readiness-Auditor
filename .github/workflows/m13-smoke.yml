name: M13 temporary real smoke

on:
  push:
    branches:
      - m13-actionable-geo-report

jobs:
  real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and Chromium
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Audit Bradesco Seguros store without AI
        run: searchgeo audit https://loja.bradescoseguros.com.br --project "Smoke M13" --max-pages 5 --ai-provider none
      - name: Validate actionable report markers
        shell: bash
        run: |
          REPORT=$(find audits -name report.html -type f | head -n 1)
          test -n "$REPORT"
          grep -q "Compatibilidade GEO" "$REPORT"
          grep -q "Cobertura e confiabilidade" "$REPORT"
          grep -q "Principais oportunidades de melhoria" "$REPORT"
          grep -q "Score GEO — Desktop" "$REPORT"
          grep -q "Score GEO — Mobile" "$REPORT"
          grep -q "Plano de correção priorizado" "$REPORT"
          grep -q "Correções técnicas detalhadas" "$REPORT"
          grep -q "Cobertura do Crawl" "$REPORT"
          grep -q "REPORT-GEO-002" "$REPORT"
          echo "Report validated at $REPORT"
