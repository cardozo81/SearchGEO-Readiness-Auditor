name: M21 validation

on:
  push:
    branches:
      - feature-external-web-performance-evidence
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src tests/test_m21_web_performance.py
      - name: M21 unit tests
        run: python -m unittest discover -s tests -p 'test_m21_web_performance.py' -v
      - name: Scoring regression
        run: python -m unittest discover -s tests -p 'test_m9_scoring.py' -v
      - name: M20 regression
        run: python -m unittest discover -s tests -p 'test_m20_content_remediation.py' -v
      - name: Stable baseline regression
        run: python -m unittest discover -s tests -p 'test_m12_stable_baseline.py' -v
