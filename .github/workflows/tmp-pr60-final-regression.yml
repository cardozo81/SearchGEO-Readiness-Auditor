name: tmp-pr60-final-regression

on:
  push:
    branches:
      - feat/report-responsive-panels-main-integration

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ubuntu
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Install Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install chromium
      - name: Compile and full regression
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Requested visual contract
        run: python -m unittest tests.test_report_visual_contract
