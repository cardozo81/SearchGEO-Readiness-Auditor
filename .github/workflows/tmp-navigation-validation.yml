name: Temporary navigation validation

on:
  push:
    branches:
      - fix-canonical-report-navigation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile changed reporting modules
        run: PYTHONPATH=src python -m py_compile src/searchgeo/report_navigation.py src/searchgeo/m20_reporting.py src/searchgeo/m21_reporting.py
      - name: Run full regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
