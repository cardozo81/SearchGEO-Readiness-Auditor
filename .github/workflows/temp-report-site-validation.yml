name: Temporary report site validation

on:
  push:
    branches:
      - report-static-site-metrics-grounding

jobs:
  docs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan legacy public report paths in Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('README.md'), *Path('docs').rglob('*.md')]:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'report.html' in line or 'remediation.html' in line:
                      print(f'{path}:{number}: {line}')
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
