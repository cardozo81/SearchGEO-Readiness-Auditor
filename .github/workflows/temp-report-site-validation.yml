name: Temporary report site validation

on:
  push:
    branches:
      - report-static-site-metrics-grounding

jobs:
  docs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan legacy public report paths in Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('README.md'), *Path('docs').rglob('*.md')]:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'report.html' in line or 'remediation.html' in line:
                      print(f'{path}:{number}: {line}')
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Real Chromium smoke — mobile, desktop and both
        shell: bash
        run: |
          set -euo pipefail
          SITE=/tmp/searchgeo-smoke-site
          rm -rf "$SITE" /tmp/searchgeo-smoke-mobile /tmp/searchgeo-smoke-desktop /tmp/searchgeo-smoke-both
          mkdir -p "$SITE"
          cat > "$SITE/index.html" <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <title>SearchGEO Smoke</title>
            <meta name="description" content="Página local de validação SearchGEO.">
            <link rel="canonical" href="http://127.0.0.1:8123/">
          </head>
          <body>
            <main>
              <h1>SearchGEO Smoke</h1>
              <h2>Conteúdo verificável</h2>
              <p>Esta página existe somente para validar rendering, persistência, scoring e report site.</p>
            </main>
          </body>
          </html>
          HTML
          python -m http.server 8123 --bind 127.0.0.1 --directory "$SITE" >/tmp/searchgeo-smoke-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          for CONTEXT in mobile desktop both; do
            ROOT="/tmp/searchgeo-smoke-${CONTEXT}"
            searchgeo audit http://127.0.0.1:8123/ \
              --project "Smoke ${CONTEXT}" \
              --max-pages 1 \
              --audits-root "$ROOT" \
              --device-context "$CONTEXT" \
              --ai-provider none
          done

          python - <<'PY'
          from pathlib import Path
          import json
          import sqlite3

          expected = {
              "mobile": {"devices": {"MOBILE"}, "mobile": True, "desktop": False},
              "desktop": {"devices": {"DESKTOP"}, "mobile": False, "desktop": True},
              "both": {"devices": {"DESKTOP", "MOBILE"}, "mobile": True, "desktop": True},
          }

          for context, spec in expected.items():
              root = Path(f"/tmp/searchgeo-smoke-{context}")
              audits = [path for path in root.iterdir() if path.is_dir()]
              assert len(audits) == 1, (context, audits)
              audit = audits[0]
              report = audit / "report"
              required = [
                  report / "index.html",
                  report / "remediation.html",
                  report / "ai-usage.html",
                  report / "references.html",
                  report / "css" / "site.css",
                  audit / "audit.db",
              ]
              for path in required:
                  assert path.is_file(), (context, path)
              assert (report / "mobile.html").is_file() is spec["mobile"], context
              assert (report / "desktop.html").is_file() is spec["desktop"], context
              assert not (audit / "report.html").exists(), context
              assert not (audit / "remediation.html").exists(), context

              for html_path in report.glob("*.html"):
                  html = html_path.read_text(encoding="utf-8")
                  assert '<link rel="stylesheet" href="css/site.css">' in html, html_path
                  assert "<style" not in html.casefold(), html_path

              con = sqlite3.connect(audit / "audit.db")
              try:
                  devices = {row[0] for row in con.execute("SELECT DISTINCT device FROM page_snapshots")}
                  assert devices == spec["devices"], (context, devices)
                  rows = con.execute(
                      "SELECT result, observed_value FROM rule_executions WHERE rule_id='BR-GEO-052'"
                  ).fetchall()
                  assert rows, context
                  results = []
                  for result, observed_raw in rows:
                      observed = json.loads(observed_raw) if isinstance(observed_raw, str) else observed_raw
                      results.append((result, observed))
                  if context in {"mobile", "desktop"}:
                      assert all(result == "NOT_APPLICABLE" for result, _ in results), results
                      assert all(
                          observed.get("reason_code") == "DEVICE_COMPARISON_DISABLED_BY_CONTEXT"
                          for _, observed in results
                      ), results
                  else:
                      assert all(
                          observed.get("reason_code") != "DEVICE_COMPARISON_DISABLED_BY_CONTEXT"
                          for _, observed in results
                      ), results
              finally:
                  con.close()
          PY
