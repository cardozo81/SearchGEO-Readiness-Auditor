name: M22 temporary validation

on:
  push:
    branches:
      - m22-domain-quality-diagnostics

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src/searchgeo
      - name: M22 tests
        run: python -m unittest discover -s tests -p 'test_m22_quality_domains.py' -v
      - name: M21 regression tests
        run: python -m unittest discover -s tests -p 'test_m21_web_performance.py' -v
