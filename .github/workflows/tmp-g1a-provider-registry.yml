name: tmp-g1a-provider-registry

on:
  push:
    branches:
      - feature/safe-provider-expansion

jobs:
  validate-g1a:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clean editable package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate timezone dependency
        shell: pwsh
        run: python -c "from zoneinfo import ZoneInfo; assert str(ZoneInfo('America/Sao_Paulo')) == 'America/Sao_Paulo'"
      - name: Focused automated tests
        shell: pwsh
        run: |
          python -m unittest tests.test_provider_registry
          python -m unittest tests.test_cli_provider_extensions
          python -m unittest tests.test_provider_extensions
          python -m unittest tests.test_provider_extensions_m20
          python -m unittest tests.test_timezone_dependency
      - name: CLI smoke
        shell: pwsh
        run: |
          searchgeo --version
          searchgeo --help
          searchgeo audit --help
