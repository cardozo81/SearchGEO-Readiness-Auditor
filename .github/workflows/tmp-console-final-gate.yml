name: tmp-console-final-gate

on:
  push:
    branches:
      - feature/interactive-execution-console

jobs:
  validate-console-final:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clean editable package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile package and tests
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Provider and console regression suite
        shell: pwsh
        run: |
          python -m unittest tests.test_provider_registry
          python -m unittest tests.test_cli_provider_extensions
          python -m unittest tests.test_provider_extensions
          python -m unittest tests.test_provider_extensions_m20
          python -m unittest tests.test_timezone_dependency
          python -m unittest tests.test_console_provider_registry
          python -m unittest tests.test_interactive_console
      - name: CLI and console entrypoints
        shell: pwsh
        run: |
          searchgeo --version
          searchgeo --help
          searchgeo audit --help | Tee-Object -Variable help
          $text = $help -join "`n"
          foreach ($provider in @('xai','qwen','gemini','anthropic')) { if ($text -notmatch $provider) { throw "missing provider $provider" } }
          python -c "from unittest.mock import patch; import searchgeo.interactive_console as c; p=patch('builtins.input', return_value='Q'); p.start(); assert c.main() == 0; p.stop()"
      - name: Verify dynamic console contract
        shell: pwsh
        run: |
          python -c "from searchgeo.console_config import PROVIDER_MENU_CHOICES,ENV_NAMES,provider_capabilities; assert PROVIDER_MENU_CHOICES == ('none','openai','deepseek','mimo','xai','qwen','gemini','anthropic','auto'); assert all(x in ENV_NAMES for x in ('XAI_API_KEY','DASHSCOPE_API_KEY','GEMINI_API_KEY','ANTHROPIC_API_KEY')); c=provider_capabilities({}); assert all(not c[x].available for x in ('xai','qwen','gemini','anthropic'))"
          python -c "from searchgeo.provider_registry import auto_provider_ids; assert auto_provider_ids() == ('openai','deepseek','mimo')"
