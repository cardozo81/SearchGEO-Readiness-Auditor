name: M18 temporary test gate

on:
  push:
    branches: [m18-multi-ai-provider-routing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply temporary M18 patch
        run: python scripts/m18_temp_patch.py
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_m18_multi_ai_provider -v
      - name: Commit validated M18 patch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/searchgeo/m18_ai.py docs
            git commit -m "fix(m18): classify empty responses and document routing"
            git push origin HEAD:m18-multi-ai-provider-routing
          fi
      - run: python -m unittest discover -s tests -v
