name: M18 temporary test gate

on:
  push:
    branches: [m18-multi-ai-provider-routing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply temporary M18 patch
        run: python scripts/m18_temp_patch.py
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_m18_multi_ai_provider -v
      - name: Commit validated M18 patch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/searchgeo/m18_ai.py tests/test_m18_multi_ai_provider.py docs
            git commit -m "fix(m18): quarantine explicit provider and add integration gate"
            git push origin HEAD:m18-multi-ai-provider-routing
          fi
      - run: python -m unittest discover -s tests -v
      - name: Conditional live provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from searchgeo.m18_ai import build_semantic_provider
          from searchgeo.semantic import ProviderState, SemanticEvidenceInput, SemanticInput

          available = [
              name for name, key in (
                  ("openai", os.environ.get("OPENAI_API_KEY")),
                  ("deepseek", os.environ.get("DEEPSEEK_API_KEY")),
                  ("mimo", os.environ.get("MIMO_API_KEY")),
              ) if key
          ]
          if not available:
              print("LIVE_SMOKE=SKIPPED_NO_CREDENTIALS")
              raise SystemExit(0)

          semantic_input = SemanticInput(
              snapshot_id="SNP-LIVE-SMOKE",
              page_url="https://example.com/m18-live-smoke",
              title="SearchGEO M18 live smoke",
              main_content="Synthetic SearchGEO provider compatibility smoke input. No website score should be inferred.",
              structured_data=None,
              primary_language="pt-BR",
              market="BR",
              evidence=(SemanticEvidenceInput(
                  evidence_id="EVD-LIVE-SMOKE",
                  evidence_type="TEXT_EXCERPT",
                  source="m18-live-smoke",
                  observed_value={"text": "Synthetic compatibility smoke input."},
              ),),
          )

          failures = []
          for name in available:
              provider = build_semantic_provider(name, env=os.environ)
              result = provider.analyze(semantic_input)
              diagnostic = result.diagnostic.error_class.value if getattr(result, "diagnostic", None) and result.diagnostic.error_class else "NONE"
              print(f"LIVE_SMOKE provider={name.upper()} state={result.state.value} diagnostic={diagnostic}")
              if result.state is not ProviderState.AVAILABLE:
                  failures.append(f"{name.upper()}:{diagnostic}")
          if failures:
              raise RuntimeError("live provider smoke failed: " + ",".join(failures))
          print("LIVE_SMOKE=SUCCESS")
          PY
