name: M18 temporary test gate

on:
  push:
    branches: [m18-multi-ai-provider-routing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_m18_multi_ai_provider -v
      - run: python -m unittest discover -s tests -v
