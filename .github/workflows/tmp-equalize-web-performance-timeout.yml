name: Temporary equalize Web Performance timeout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-equalize-web-performance-timeout.yml

permissions:
  contents: write

jobs:
  equalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Equalize defaults and normative documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              'src/searchgeo/cli.py',
              '_DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS = 60.0',
              '_DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS = 120.0',
          )
          replace_exact(
              'src/searchgeo/m21_web_performance.py',
              'timeout_seconds: float = 60.0',
              'timeout_seconds: float = 120.0',
          )
          replace_exact(
              'docs/specification/21_EXTERNAL_WEB_PERFORMANCE_EVIDENCE.md',
              'Default:\n\n```text\n60\n```\n\nO timeout vale por requisição externa.',
              'Default:\n\n```text\n120\n```\n\nO timeout vale por requisição externa.',
          )
          replace_exact(
              'docs/specification/21_EXTERNAL_WEB_PERFORMANCE_EVIDENCE.md',
              'O valor de 60 segundos é default operacional',
              'O valor de 120 segundos é default operacional',
          )

          Path('tests/test_web_performance_timeout_default.py').write_text(
              '''from __future__ import annotations\n\nimport unittest\n\nfrom searchgeo import cli\nfrom searchgeo.m21_web_performance import WebPerformanceConfig\nfrom searchgeo.provider_runtime_policy import DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS\n\n\nclass WebPerformanceTimeoutDefaultTests(unittest.TestCase):\n    def test_all_runtime_defaults_are_120_seconds(self) -> None:\n        self.assertEqual(DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS, 120.0)\n        self.assertEqual(cli._DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS, 120.0)\n        self.assertEqual(WebPerformanceConfig().timeout_seconds, 120.0)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
              encoding='utf-8',
              newline='\n',
          )

      - name: Install package
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Focused timeout test
        run: python -m unittest tests.test_web_performance_timeout_default -v

      - name: Web Performance regression
        run: python -m unittest tests.test_m21_web_performance -v

      - name: Full regression
        run: python -m unittest discover -s tests -v

      - name: Verify no legacy 60-second default remains
        shell: python
        run: |
          from pathlib import Path
          checks = {
              'src/searchgeo/cli.py': '_DEFAULT_WEB_PERFORMANCE_TIMEOUT_SECONDS = 60.0',
              'src/searchgeo/m21_web_performance.py': 'timeout_seconds: float = 60.0',
              'docs/specification/21_EXTERNAL_WEB_PERFORMANCE_EVIDENCE.md': 'O valor de 60 segundos é default operacional',
          }
          for path, needle in checks.items():
              if needle in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'legacy default remains in {path}: {needle}')

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-equalize-web-performance-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/searchgeo/cli.py src/searchgeo/m21_web_performance.py docs/specification/21_EXTERNAL_WEB_PERFORMANCE_EVIDENCE.md tests/test_web_performance_timeout_default.py .github/workflows/tmp-equalize-web-performance-timeout.yml
          git commit -m "fix: unificar timeout Web Performance em 120s"
          git push origin HEAD:main
