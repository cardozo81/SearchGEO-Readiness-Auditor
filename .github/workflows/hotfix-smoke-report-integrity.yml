name: Hotfix smoke report integrity

on:
  push:
    branches:
      - hotfix-smoke-m17-report-integrity

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Targeted regressions
        run: |
          python -m unittest \
            tests.test_hotfix_smoke_report_integrity \
            tests.test_hotfix_ai_reporting_integrity \
            tests.test_hotfix_m17_duplicate_remediation
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -p 'test_*.py'
