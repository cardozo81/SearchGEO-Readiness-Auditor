name: Consolidated reporting safety

on:
  pull_request:
    branches: [main]
    paths:
      - "src/searchgeo/consolidation/**"
      - "src/searchgeo/console_entrypoint.py"
      - "tests/test_consolidation*.py"
      - "docs/CONSOLIDATED_REPORTING.md"
      - ".github/workflows/consolidated-reporting-ci.yml"

permissions:
  contents: read

jobs:
  consolidation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile changed Python surface
        run: python -m compileall -q src/searchgeo/consolidation src/searchgeo/console_entrypoint.py tests/test_consolidation.py tests/test_consolidation_console_integration.py
      - name: Run consolidation regression tests
        run: python -m unittest -v tests.test_consolidation tests.test_consolidation_console_integration
